<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarek Ali - Businessman</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            padding: 30px;
            text-align: center;
            margin: 20px auto;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0070f3;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
            color: #111;
        }
        .tagline {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 25px;
        }
        .contact-info {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .contact-item strong {
            width: 80px;
            color: #555;
        }
        .contact-item a {
            color: #0070f3;
            text-decoration: none;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Profile Picture Placeholder -->
        <!-- Save your picture as "profile.jpg" in the same folder as this file -->
        <img src="profile.jpg" alt="Tarek Ali" class="profile-pic">
        
        <h1>Tarek Ali</h1>
        <div class="tagline">Businessman</div>
        
        <p class="bio">
            We specialize in high-quality elevator products. Our business imports and provides professional installation services to deliver safe, reliable vertical mobility solutions.
        </p>
        
        <div class="contact-info">
            <div class="contact-item">
                <strong>Email:</strong>
                <a href="mailto:tarek.ali.eu@gmail.com">tarek.ali.eu@gmail.com</a>
            </div>
            <div class="contact-item">
                <strong>Phone:</strong>
                <a href="tel:+8801711035702">+8801711035702</a>
            </div>
        </div>
    </div>

</body>
</html>
